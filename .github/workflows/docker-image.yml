name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Set Image Tag
      run: echo "IMAGE_TAG=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

    - name: Build the Docker image (timestamp tag only)
      run: |
        docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/gp_flask_docker:$IMAGE_TAG .

    - name: Push the Docker image (timestamp tag only)
      run: |
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/gp_flask_docker:$IMAGE_TAG
